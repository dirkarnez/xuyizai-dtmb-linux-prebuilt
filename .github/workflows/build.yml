name: docker-compose-actions-workflow
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
      - 'c*'

permissions:
    contents: write
    
jobs:
  build:
    strategy:
      matrix:
        platforms: [ "linux/amd64", "linux/arm64" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: ${{ matrix.platforms }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      
    # continue-on-error: true
      - name: set permission and run
        run: |
          sudo chmod -R +x . && \
          mkdir -p dist && \
          ls && \
          docker compose up --build && docker compose down

      - working-directory: dist
        run: |
          mkdir -p kernel
          
      - working-directory: dist
        run: |
          mkdir -p userspace/firmware
          
      - run: |
          cp ./userspace/firmware/dvb-usb-lme2510c-dtmb-5300.fw ./dist/userspace/firmware/ && \
          cp ./userspace/run_lme2510_libusb.sh ./dist/userspace/ && \
          cp ./userspace/lme2510_dtmb_libusb ./dist/userspace/
          
      - working-directory: dist
        run: |
          ls -R
          
      # - uses: fastai/workflows/ssh@master
      #   with:
      #     ssh_key: ${{ secrets.SSH_KEY }}
      #     key_file: id_ecdsa
          
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@master
      
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: 'zip'
          directory: "dist"
          filename: "xuyizai-dtmb-linux-prebuilt-${{ matrix.platforms }}-${{ github.ref_name }}.zip"
          
      - name: Release prebuilt
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/xuyizai-dtmb-linux-prebuilt-${{ matrix.platforms }}-${{ github.ref_name }}.zip"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
